name: Bug report
description: Something in the Claude or Codex widget doesn't work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. For a security problem, use [private reporting](https://github.com/Solarity-AI/ai-usage-taskbar-widgets/security/advisories/new) instead.
        Never paste tokens, `.credentials.json`, `auth.json` or your email address here.
  - type: dropdown
    id: widget
    attributes:
      label: Which widget?
      options:
        - Claude
        - Codex
        - Both
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Widget version
      description: Right-click the pill → About shows it, e.g. 1.1.0.
      placeholder: 1.1.0
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version and display scaling
      placeholder: Windows 11 24H2, 125%
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: Steps to reproduce if you have them. A screenshot of the pill or card helps.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Last lines of widget.log
      description: Right-click the pill → Open data folder → widget.log. Remove anything personal before pasting.
      render: text
