name: Screenshots

# Draws the website and README images from the widget code (tools/screenshots.ps1) on Windows and uploads them.
# Runs by hand, and on pull requests that change the tool, so it never goes stale unnoticed.
on:
  workflow_dispatch:
  pull_request:
    paths: ['tools/screenshots.ps1', '.github/workflows/screenshots.yml']

permissions:
  contents: read

jobs:
  images:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Draw the images
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools\screenshots.ps1 -OutDir "$env:RUNNER_TEMP\shots"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: images
          path: ${{ runner.temp }}/shots
          if-no-files-found: error
