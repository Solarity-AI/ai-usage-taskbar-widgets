name: Release

# Push a tag such as v1.0.0 to publish that version: tests run first, then the zips, checksums and the
# CHANGELOG section become a GitHub release. The tag must match $script:Version and the newest CHANGELOG entry.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Tests
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests\run-tests.ps1

      - name: Build the downloads
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools\package.ps1 -Version $env:GITHUB_REF_NAME.TrimStart('v')

      - name: Publish the release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release create $tag dist\ai-usage-taskbar-widgets.zip dist\claude-usage-widget.zip dist\codex-usage-widget.zip dist\SHA256SUMS.txt --title "$tag" --notes-file dist\release-notes.md --verify-tag --latest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
