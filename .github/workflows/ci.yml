name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Generated files, BOMs, parse check and both test suites
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests\run-tests.ps1
