name: CI

# Windows widgets: generated files, links, packaging and both test suites. The macOS app has its own
# workflow (macos.yml), so changes only under macos/ skip this one.
on:
  push:
    branches: [main]
    paths-ignore: ['macos/**']
  pull_request:
    paths-ignore: ['macos/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Generated files, BOMs, parse check and both test suites
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests\run-tests.ps1
      - name: PSScriptAnalyzer gate
        shell: powershell
        run: |
          Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Scope CurrentUser -Force | Out-Null
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force -Repository PSGallery
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\lint.ps1
