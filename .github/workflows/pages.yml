name: Website

# Publishes site/ to GitHub Pages: https://solarity-ai.github.io/ai-usage-taskbar-widgets/
on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check that every local link and image exists
        run: |
          cd site
          missing=0
          # A link with #anchor or ?query is checked too (the file part before it must exist).
          for ref in $(grep -oE '(src|href)="[^"#:?]+([#?][^"]*)?"' index.html | sed -E 's/^(src|href)="//; s/"$//; s/[#?].*$//' | sort -u); do
            case "$ref" in ./) continue ;; esac
            if [ ! -e "$ref" ]; then echo "::error::site/index.html links to missing file $ref"; missing=1; fi
          done
          exit $missing
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
