name: macOS app

# Builds the macOS menu-bar app and runs macos/test.sh: the self-tests, the version check, replies with
# out-of-range numbers and a local stand-in for the usage API. No sign-in and no network beyond 127.0.0.1.
on:
  pull_request:
    paths: ['macos/**', 'CHANGELOG.md', '.github/workflows/macos.yml']
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same pull request cancels the older macOS run. Only pull_request and
# workflow_dispatch start this workflow, so no main-branch run is ever cancelled.
concurrency:
  group: macos-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS app
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and test
        run: ./macos/test.sh
